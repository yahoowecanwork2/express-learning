<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>404 - Page Not Found</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #f5f5f5;
        text-align: center;
      }

      .container {
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      }

      h1 {
        font-size: 80px;
        margin: 0;
        color: #ff4d4f;
      }

      p {
        font-size: 18px;
        margin: 10px 0 30px;
        color: #555;
      }

      a {
        text-decoration: none;
        background: #000;
        color: white;
        padding: 12px 25px;
        border-radius: 6px;
        transition: 0.3s;
      }

      a:hover {
        background: #333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <p>Oops! Page Not Found</p>

      <a href="/">Back To Home</a>
    </div>
  </body>
</html>
